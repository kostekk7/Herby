<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herby</title>
</head>
<body>
    <h2>Miasta i herby</h2>
    <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tabela miast</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
        }

        th, td {
            border: 1px solid #777;
            padding: 10px;
            text-align: center;
        }

        td:first-child {
            width: 30%;
            font-family: sans-serif;
            font-size: 14px;
        }

        td img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>Nowy Sącz</td>
            <td><img src="POL_Nowy_Sącz_COA1.png" alt="Herb Nowego Sącza"></td>
        </tr>
        <tr>
            <td>Krosno</td>
            <td><img src="POL_Krosno_COA1.png" alt="Herb Krosna"></td>
        </tr>
        <tr>
            <td>Katowice</td>
            <td><img src="herb_katowic.png" alt="Herb Katowic"></td>
        </tr>
        <tr>
            <td>Wieliczka</td>
            <td><img src="POL_Wieliczka_COA_1.png" alt="Herb Wieliczki"></td>
        </tr>
    </table>

</body>
</html>
</body>
</html>
